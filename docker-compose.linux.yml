# Modo distribuido en Linux containers: API (orquestador) + 3 workers por etapa.
# Equivalente a docker-compose.yml pero con la imagen Linux (Dockerfile.linux),
# volumen POSIX y healthcheck por curl.
#
# Azure (ADLS) y SQL Server se configuran DESDE EL PORTAL (Sources/Destinations).
# Los parámetros operativos se editan en /settings. Aquí solo van la clave entre
# servicios y el modo/volumen.
#
# TRANSLATE_ENUMS (activo por defecto en este compose; TRANSLATE_ENUMS=false en .env lo apaga):
# traduce los optionsets de Dataverse/F&O añadiendo al final
# de cada tabla una columna [<col>_$label] con el ExternalValue (idioma 1033). Solo lo
# usa la etapa SQL, así que basta ponerlo en worker-sql.
#
# Escalado por etapa:
#   docker compose -f docker-compose.linux.yml up -d --build --scale worker-ingest=3

# Nombre de proyecto fijo: el volumen es siempre sluice_pipeline-data, sea cual sea la carpeta.
name: sluice

# Rotación de logs: hasta 5 ficheros de 20 MB, con el driver local (comprimido).
x-logging: &default-logging
  driver: local
  options:
    max-size: 20m
    max-file: "5"

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.linux
    image: sluice-portal:linux
    ports:
      # Solo en la propia máquina por defecto: para acceso remoto, TLS delante (ver la guía de instalación).
      - "${SLUICE_HTTP_BIND:-127.0.0.1}:${SLUICE_HTTP_PORT:-58472}:58472"
    environment:
      ASPNETCORE_URLS: http://+:58472
      EXECUTION_MODE: distributed
      DATA_DIR: /data
      UI_API_KEY: ${UI_API_KEY:-}
      AUTH_MODE: ${AUTH_MODE:-key}
      # Alertas, deadman y sesión (opcionales, desde .env; ver .env.example). Vacías, no se usan.
      ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-}
      DEADMAN_PING_URL: ${DEADMAN_PING_URL:-}
      CHANGELOG_STALL_HOURS: ${CHANGELOG_STALL_HOURS:-}
      SESSION_EXPIRY_HOURS: ${SESSION_EXPIRY_HOURS:-}
    volumes:
      - pipeline-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:58472/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped
    mem_limit: 2g
    cpus: 2
    logging: *default-logging

  worker-ingest:
    build:
      context: .
      dockerfile: Dockerfile.linux
    image: sluice-portal:linux
    environment:
      EXECUTION_MODE: distributed
      DATA_DIR: /data
      UI_API_KEY: ${UI_API_KEY:-}
      AUTH_MODE: ${AUTH_MODE:-key}
      WORKER_STAGE: ingest
      ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-}   # las etapas también envían alertas
    volumes:
      - pipeline-data:/data
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    # Sin mem_limit fijo: el volumen de ingesta por entidad/snapshot no es predecible de
    # antemano (ej. el volcado histórico inicial de una tabla puede ser un único CSV de
    # cientos de MB); un tope arbitrario solo pospone el mismo problema con otra tabla. El
    # worker usa la memoria real disponible del host en vez de un techo artificial.
    cpus: 2
    logging: *default-logging

  worker-sql:
    build:
      context: .
      dockerfile: Dockerfile.linux
    image: sluice-portal:linux
    environment:
      EXECUTION_MODE: distributed
      DATA_DIR: /data
      UI_API_KEY: ${UI_API_KEY:-}
      AUTH_MODE: ${AUTH_MODE:-key}
      WORKER_STAGE: sql
      ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-}   # las etapas también envían alertas
      TRANSLATE_ENUMS: ${TRANSLATE_ENUMS:-true}
    volumes:
      - pipeline-data:/data
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    # Ver comentario de mem_limit en worker-ingest: memoria dinámica, sin tope fijo.
    cpus: 2
    logging: *default-logging

  worker-reconcile:
    build:
      context: .
      dockerfile: Dockerfile.linux
    image: sluice-portal:linux
    environment:
      EXECUTION_MODE: distributed
      DATA_DIR: /data
      UI_API_KEY: ${UI_API_KEY:-}
      AUTH_MODE: ${AUTH_MODE:-key}
      WORKER_STAGE: reconcile
      ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-}   # las etapas también envían alertas
    volumes:
      - pipeline-data:/data
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    # Ver comentario de mem_limit en worker-ingest: memoria dinámica, sin tope fijo.
    cpus: 2
    logging: *default-logging

volumes:
  pipeline-data:
