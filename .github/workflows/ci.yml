name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test:
    runs-on: ubuntu-latest
    # SQL Server efímero para los tests [SqlFact] (MERGE, truncate, resync): sin él salían como
    # Passed sin ejecutarse. Solo vive dentro del runner durante el job, así que la contraseña no
    # protege nada real. Actions espera a que el healthcheck pase antes de los pasos.
    services:
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: "SluiceCi_Only_2026x"
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P SluiceCi_Only_2026x -Q 'SELECT 1' -b"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
          --health-start-period 20s
    env:
      SLUICE_TEST_SQL: "Server=127.0.0.1,1433;Database=master;User Id=sa;Password=SluiceCi_Only_2026x;TrustServerCertificate=True;Encrypt=False"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore Sluice.Portal.sln

      - name: Build
        run: dotnet build Sluice.Portal.sln --no-restore -c Release

      - name: Test
        run: dotnet test Sluice.Portal.Tests --no-build -c Release --logger "trx"

      - name: Publish test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: "**/*.trx"

  ui-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore Sluice.Portal.sln

      - name: Build
        run: dotnet build Sluice.Portal.sln --no-restore -c Release

      - name: Install Playwright browsers
        run: pwsh Sluice.Portal.UITests/bin/Release/net10.0/playwright.ps1 install --with-deps chromium

      - name: UI tests
        run: dotnet test Sluice.Portal.UITests --no-build -c Release --logger "trx"

      - name: Publish UI test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-test-results
          path: "**/*.trx"
