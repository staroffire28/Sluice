name: UAT

# Suite UAT por interfaz (docs/uat/escenarios.md). Solo bajo demanda: Actions → UAT → Run workflow.
# No bloquea PRs. El origen es la carpeta local simulada que genera la propia suite; nunca se
# conecta a un storage account.
on:
  workflow_dispatch:
    inputs:
      area:
        description: "Área (vacío = todas): Access, Sources, Destinations, Pipelines, Jobs, Details, Quality, Navigation, Settings, Variants"
        required: false
        default: ""
      scenario:
        description: "Escenario concreto, p. ej. UAT-PIP-02 (vacío = todos)"
        required: false
        default: ""

jobs:
  uat:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # SQL Server efímero: solo vive dentro del runner, así que la contraseña no protege nada real.
    services:
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: "SluiceUat_Only_2026x"
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P SluiceUat_Only_2026x -Q 'SELECT 1' -b"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
          --health-start-period 20s
    env:
      SLUICE_UAT_SQL: "Server=127.0.0.1,1433;Database=master;User Id=sa;Password=SluiceUat_Only_2026x;TrustServerCertificate=True;Encrypt=False"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Build
        run: dotnet build Sluice.Portal.sln -c Debug

      - name: Install Playwright browsers
        run: pwsh Sluice.Portal.UatTests/bin/Debug/net10.0/playwright.ps1 install --with-deps chromium

      # Los inputs llegan por variables de entorno, no interpolados en el script.
      - name: UAT
        shell: pwsh
        env:
          UAT_AREA: ${{ inputs.area }}
          UAT_SCENARIO: ${{ inputs.scenario }}
        run: |
          $params = @{ NoBuild = $true }
          if ($env:UAT_AREA) { $params.Area = $env:UAT_AREA }
          if ($env:UAT_SCENARIO) { $params.Scenario = $env:UAT_SCENARIO }
          ./scripts/uat.ps1 @params

      - name: Publish UAT report and failure artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: uat-results
          path: TestResults/uat/
