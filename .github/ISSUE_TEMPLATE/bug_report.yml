name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. **Do not paste credentials, connection strings or API keys.**
        For security problems use the private report in the Security tab instead.
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: What you did, what you expected and what you got instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to ...
        2. Click ...
    validations:
      required: true
  - type: dropdown
    id: runtime
    attributes:
      label: How are you running Sluice?
      options:
        - Linux containers (docker-compose.linux.yml)
        - Windows containers (docker-compose.yml)
        - Monolith container (docker-compose.monolith.yml)
        - From source (dotnet run)
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: e.g. a commit SHA from main
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Remove secrets, hostnames and any customer data before pasting.
      render: shell
