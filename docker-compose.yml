# Distributed mode: API enqueues tasks; workers claim via shared volume (DATA_DIR).
# Requires Docker Windows containers and a named volume (atomic File.Move queue).
#
# Azure (ADLS) y SQL Server se configuran DESDE EL PORTAL, por conexión
# (páginas Sources/Destinations). Los parámetros operativos (poll del scheduler,
# lease de tareas, % de divergencia) se editan en la página /settings del portal.
# Aquí solo van la clave entre servicios y el modo/volumen.
#
# TRANSLATE_ENUMS (opt-in, off por defecto): traduce los optionsets de Dataverse/F&O
# añadiendo al final de cada tabla una columna [<col>_$label] con el ExternalValue
# (idioma 1033, excluye sysdatastatecode), leído del GlobalOptionsetMetadata.csv del
# snapshot más reciente. Solo lo usa la etapa SQL, así que basta ponerlo en worker-sql.
#
# Escalado horizontal — varias réplicas por stage cuando hay carga:
#   docker compose up -d --build --scale worker-ingest=3 --scale worker-sql=2
# Los workers NO fijan WORKER_ID a propósito: cada réplica usa su hostname
# (Environment.MachineName) como id único, así el claim atómico de la cola
# (TaskStore.TryClaimAsync) no colisiona entre réplicas del mismo stage.
# Mide dónde satura antes de escalar: el cuello puede ser
# SQL/ADLS, no el worker — y eso no se arregla con más réplicas.

# Rotación de logs: hasta 5 ficheros de 20 MB. Driver json-file fijo: son opciones exclusivas de json-file/local.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: 20m
    max-file: "5"

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    # Imagen única compartida por api y workers: mismo binario, el rol lo decide
    # EXECUTION_MODE/WORKER_STAGE en runtime. Compose la construye una sola vez.
    image: sluice-portal:local
    platform: windows/amd64
    ports:
      # Solo en la propia máquina por defecto: para acceso remoto, TLS delante (ver la guía de instalación).
      - "${SLUICE_HTTP_BIND:-127.0.0.1}:${SLUICE_HTTP_PORT:-58472}:58472"
    environment:
      ASPNETCORE_URLS: http://+:58472
      EXECUTION_MODE: distributed
      DATA_DIR: C:/data
      UI_API_KEY: ${UI_API_KEY:-}
      AUTH_MODE: ${AUTH_MODE:-key}
    volumes:
      - pipeline-data:C:/data
    healthcheck:
      test: ["CMD", "powershell", "-Command", "try { (Invoke-WebRequest -Uri http://localhost:58472/health -UseBasicParsing).StatusCode -eq 200 } catch { exit 1 }"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped
    mem_limit: 2g
    cpus: 2
    logging: *default-logging

  worker-ingest:
    build:
      context: .
      dockerfile: Dockerfile
    image: sluice-portal:local
    platform: windows/amd64
    environment:
      EXECUTION_MODE: distributed
      DATA_DIR: C:/data
      UI_API_KEY: ${UI_API_KEY:-}
      AUTH_MODE: ${AUTH_MODE:-key}
      WORKER_STAGE: ingest
    volumes:
      - pipeline-data:C:/data
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    # Sin mem_limit fijo: el volumen de ingesta por entidad/snapshot no es predecible de
    # antemano (ej. el volcado histórico inicial de una tabla puede ser un único CSV de
    # cientos de MB); un tope arbitrario solo pospone el mismo problema con otra tabla. El
    # worker usa la memoria real disponible del host en vez de un techo artificial.
    cpus: 2
    logging: *default-logging

  worker-sql:
    build:
      context: .
      dockerfile: Dockerfile
    image: sluice-portal:local
    platform: windows/amd64
    environment:
      EXECUTION_MODE: distributed
      DATA_DIR: C:/data
      UI_API_KEY: ${UI_API_KEY:-}
      AUTH_MODE: ${AUTH_MODE:-key}
      WORKER_STAGE: sql
      TRANSLATE_ENUMS: "true"
    volumes:
      - pipeline-data:C:/data
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    # Ver comentario de mem_limit en worker-ingest: memoria dinámica, sin tope fijo.
    cpus: 2
    logging: *default-logging

  worker-reconcile:
    build:
      context: .
      dockerfile: Dockerfile
    image: sluice-portal:local
    platform: windows/amd64
    environment:
      EXECUTION_MODE: distributed
      DATA_DIR: C:/data
      UI_API_KEY: ${UI_API_KEY:-}
      AUTH_MODE: ${AUTH_MODE:-key}
      WORKER_STAGE: reconcile
    volumes:
      - pipeline-data:C:/data
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    # Ver comentario de mem_limit en worker-ingest: memoria dinámica, sin tope fijo.
    cpus: 2
    logging: *default-logging

volumes:
  pipeline-data:
